}

                const slashPos = cleaned.indexOf("/");
                const num = Number(cleaned.substring(0, slashPos));
                const den = Number(cleaned.substring(slashPos + 1));

    freshGamutData.forEach((node) => {
        noteNames.push(node.name);
        
        let calculatedCentsVal = 0;
        let visualRatioLabel = node.ratio;
        let compliantEngineRatio = node.ratio;

        if (String(node.ratio).includes("/")) {
            // -- Ratios Parser Framework --
            const slashPos = node.ratio.indexOf("/");
            const num = Number(node.ratio.substring(0, slashPos));
            const den = Number(node.ratio.substring(slashPos + 1));
            calculatedCentsVal = 1200.0 * Math.log2(num / den);
            
            const profile = getHarmonicProfile(num, den);
            let temp_top = profile, temp_bot = profile;
            while (temp_top % 3 === 0 && temp_top > 0) temp_top = Math.floor(temp_top / 3);
            while (temp_bot % 3 === 0 && temp_bot > 0) temp_bot = Math.floor(temp_bot / 3);
            nodeTypes.push((temp_top === 11 || temp_bot === 11) ? 'limit_11' : 'pythagorean');
        } else {
            // -- Cents Parser Framework (e.g., for EDO_24) --
            calculatedCentsVal = parseFloat(node.ratio);
            nodeTypes.push('pythagorean'); 
            
            visualRatioLabel = calculatedCentsVal.toFixed(1) + "¢";
            
            // Build compliant fallback ratio string to prevent down-stream app crashes
            const decimalMultiplier = Math.pow(2.0, calculatedCentsVal / 1200.0);
            compliantEngineRatio = decimalMultiplier.toFixed(6) + "/1";
        }

        // Push sanitized node blocks directly to the global engine array matrix
        cents.push(calculatedCentsVal);
        ratios.push(compliantEngineRatio);

        masterNoteMatrix.push({
            name: node.name,
            ratio: compliantEngineRatio, 
            type: node.type,
            calculatedCents: calculatedCentsVal,
            txtLine1: getCleanSymbolLabel(node.name) + " (" + visualRatioLabel + ")",
            txtLine2: Math.round(calculatedCentsVal) + "¢"
        });
    });

    // 4. Force audio engine cleanup to kill lingering voice threads
    if (typeof stopAllVoices === 'function') {
        stopAllVoices();
    }

    // 5. Draw updated pitch maps straight to screen view ports
    if (typeof updatePlot === 'function') {
        updatePlot();
    }
}

window.addEventListener('keydown', (e) => {
    if (e.code === 'Backspace' && document.activeElement !== textEntry) {
        e.preventDefault();
        clearAllHeldNotes();
        return; 
    }

    if (document.activeElement === textEntry) return;

    // A. Handle Spacebar Global Play/Stop Trigger Shortcut cleanly
    if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault();
        if (previewToggleBtn) {
            previewToggleBtn.click();
        }
        return;
    }

    const codeMap = { 'Digit1': 0, 'Digit2': 1, 'Digit3': 2, 'Digit4': 3, 'Digit5': 4, 'Digit6': 5, 'Digit7': 6, 'Digit8': 7, 'Digit9': 8, 'Digit0': 9 };
    const targetIndex = codeMap[e.code]; 
    if (targetIndex === undefined) return;
    const holdActive = document.getElementById('hold-toggle').checked;

    const keyboardVoiceId = "kbd_voice_" + e.code;

    if (holdActive) {
        if (latchedKeyboardKeys.has(e.code)) {
            latchedKeyboardKeys.delete(e.code);
            stopVoicePoly(keyboardVoiceId); 
            delete activeKeyboardKeyToNoteNameMap[e.code];
            requestAnimationFrame(updatePlot);
            return;
        }
        latchedKeyboardKeys.add(e.code);
    } else {
        if (activeKeyboardKeysHeld[e.code]) return; 
        activeKeyboardKeysHeld[e.code] = true;
    }

    const setup = getCleanAscendingTransposed(); 
    if (!setup || !setup.path || setup.path.length === 0) return;
    
    let targetCents = null; 
    let noteNamePlayed = null; 
    const rotationCents = parseFloat(currentRotationOffset) * (1200.0 / 360.0);
    const noteCentsMap = {}; 
    noteNames.forEach((name, i) => { noteCentsMap[name] = cents[i]; });
    const isUpperCasedAction = e.shiftKey || e.getModifierState('CapsLock'); 

    let filteredNotesList = [...primaryLoopNotes].filter(note => !Object.values(detourMap).includes(note));
    filteredNotesList = [...new Set(filteredNotesList)];
    
    filteredNotesList.sort((a, b) => {
        const rawA = customPitches[a] !== undefined ? customPitches[a] : noteCentsMap[a];
        const rawB = customPitches[b] !== undefined ? customPitches[b] : noteCentsMap[b];
        let normA = (rawA + rotationCents + 12000.0) % 1200.0;
        let normB = (rawB + rotationCents + 12000.0) % 1200.0;
        if (normA < setup.tonic - 0.01) normA += 1200.0;
        if (normB < setup.tonic - 0.01) normB += 1200.0;
        if (Math.abs(normA - normB) < 0.05) return 0; 
        return normA - normB;
    });

    const octaveIndex = filteredNotesList.length;

    if (targetIndex < filteredNotesList.length) {
        const noteNameAtKey = filteredNotesList[targetIndex];
        noteNamePlayed = (isUpperCasedAction && detourMap[noteNameAtKey]) ? detourMap[noteNameAtKey] : noteNameAtKey;

        let baseCents = 0;
        if (customPitches[noteNamePlayed] !== undefined) {
            baseCents = customPitches[noteNamePlayed];
        } else {
            const baseMatrixName = String(noteNamePlayed).split("__")[0];
            const targetNoteIdx = noteNames.indexOf(baseMatrixName);
            baseCents = targetNoteIdx >= 0 ? cents[targetNoteIdx] : 0;
        }

        targetCents = (baseCents + rotationCents + 12000.0) % 1200.0;
        if (targetCents < setup.tonic - 0.01) targetCents += 1200.0;

    } else if (targetIndex === octaveIndex) { 
        targetCents = setup.tonic + 1200.0; 
        noteNamePlayed = parsedFirstTonicName || (filteredNotesList.length > 0 ? filteredNotesList[0] : "C"); 
    }

    if (targetCents !== null) { 
        e.preventDefault(); 
        const frequencyHz = masterBaseHz * Math.pow(2.0, targetCents / 1200.0); 
        activeKeyboardKeyToNoteNameMap[e.code] = noteNamePlayed; 
        startVoicePoly(keyboardVoiceId, frequencyHz, noteNamePlayed); 
        requestAnimationFrame(updatePlot);
    }
});

function handlePointerDown(e) {
    if (e.pointerType === 'touch') canvas.setPointerCapture(e.pointerId);
    
    const rect = canvas.getBoundingClientRect(); 
    const mx = (e.clientX - rect.left) * (canvas.width / rect.width); 
    const my = (e.clientY - rect.top) * (canvas.height / rect.height); 
    
    for (let area of nodeClickAreas) { 
        const dist = Math.hypot(mx - area.x, my - area.y); 

        if (dist <= area.radius) { 
            const noteInstance = masterNoteMatrix.find(n => n.name === area.name);
            const slashPos = noteInstance.ratio.indexOf("/");
            const num = Number(noteInstance.ratio.substring(0, slashPos));
            const den = Number(noteInstance.ratio.substring(slashPos + 1));
            const baseCentsValue = 1200.0 * Math.log2(num / den);
            const nonTransposedHz = 261.63 * Math.pow(2.0, baseCentsValue / 1200.0);
            
            const holdActive = document.getElementById('hold-toggle').checked;
            
            if (holdActive) {
                const touchVoiceId = "canvas_touch_" + area.name.replace(/\s+/g, '_');
                if (activeVoicesMap.has(touchVoiceId)) {
                    stopVoicePoly(touchVoiceId);
                } else {
                    startVoicePoly(touchVoiceId, nonTransposedHz, "static_grid_node__" + area.name); 
                }
            } else {
                // CHANGE 1: Use a voice ID unique to BOTH the finger and the specific note name
                const specificTouchVoiceId = `touch_${e.pointerId}_${area.name.replace(/\s+/g, '_')}`;
                
                // CHANGE 2: Record this specific voice ID to our tracker map
                activeTouchNotesMap.set(e.pointerId, specificTouchVoiceId);
                
                startVoicePoly(specificTouchVoiceId, nonTransposedHz, "static_grid_node__" + area.name); 
            }
            break; 
        }
    }
}



function handlePointerUp(e) { 
    if (e.pointerType === 'touch') {
        try { canvas.releasePointerCapture(e.pointerId); } catch(err) {}
    }
    isDraggingScale = false; 

    // CHANGE 3: Fetch the specific note-bound voice ID for this finger release
    if (activeTouchNotesMap.has(e.pointerId)) {
        const voiceIdToStop = activeTouchNotesMap.get(e.pointerId);
        stopVoicePoly(voiceIdToStop);
        activeTouchNotesMap.delete(e.pointerId); // Clean up tracking memory
    } else {
        // Fallback catch-all to prevent accidental stuck notes
        stopVoicePoly("canvas_touch_" + e.pointerId); 
    }
}



async function exportToScala() {
    // 1. Identify the structural format of your input scale string tokens
    const rawText = textEntry.value;
    let notesString = rawText.includes("=") ? rawText.split("=")[1] : rawText;
    const items = notesString.split(",").map(s => s.trim()).filter(Boolean);
    
    let isCentsScale = false;
    let isRatioScale = false;
    let containsTraditionalNotes = false; // NEW: Explicitly track if named pitch nodes are present

    items.forEach(item => {
        let cleanedItem = item.replace(/\(.*?\)/g, "").replace(/-.*/g, "").trim();
        const isFraction = cleanedItem.includes("/");
        const isNumericValue = !isNaN(parseFloat(cleanedItem)) && isFinite(cleanedItem);
        
        if (isFraction) {
            isRatioScale = true;
        } else if (isNumericValue) {
            isCentsScale = true;
        } else {
            // If it's not a pure number or fraction, it contains a traditional named grid pin
            containsTraditionalNotes = true;
        }
    });

    // CRITICAL SECURITY FIX: If the scale relies on named structural notes at all, 
    // it MUST pass the geometric alignment lock test, even if mixed with raw numbers/fractions.
    if (containsTraditionalNotes && !checkCurrentAlignmentLock()) { 
        alert("Export Aborted: One or more geometric line intersections sit more than 3 cents away from a valid pitch node."); 
        return; 
    }

    // Determine fallback routing mechanics
    const isTraditionalScale = !isCentsScale && !isRatioScale;

    // 2. Conditionally handle rotation math based on your scale definition types
    let rotationCents = 0;
    if (containsTraditionalNotes) { // FIXED: Keep rotation synchronized for any layout using background pins
        rotationCents = parseFloat(currentRotationOffset) * (1200.0 / 360.0);
    }

    let activeScalePitches = [];
    
    activeVisualScaleNotes.forEach(uniqueKey => {
        // Retrieve the baseline cent height of this item step
        let nativeCents = customPitches[uniqueKey];
        if (nativeCents === undefined) {
            const baseName = uniqueKey.split("__")[0];
            const baseIdx = noteNames.indexOf(baseName);
            if (baseIdx >= 0) nativeCents = cents[baseIdx];
        }

        if (nativeCents !== undefined) {
            // Compute the operational absolute position
            const targetCentsValue = (nativeCents + rotationCents + 12000.0) % 1200.0;
            
            // Match this coordinate spot to the absolute closest physical background matrix pin node
            let closestMatrixIdx = 0;
            let minDiff = Infinity;
            for (let n = 0; n < cents.length; n++) {
                let diff = Math.abs(cents[n] - targetCentsValue);
                if (diff > 600) diff = 1200 - diff;
                if (diff < minDiff) {
                    minDiff = diff;
                    closestMatrixIdx = n;
                }
            }

            activeScalePitches.push({
                name: noteNames[closestMatrixIdx],
                cents: cents[closestMatrixIdx],
                ratio: ratios[closestMatrixIdx],
                originalCents: nativeCents,
                key: uniqueKey
            });
        }
    });

    if (activeScalePitches.length === 0) return;

    // 3. Order notes chronologically across the tuning circle structure
    if (isTraditionalScale) {
        activeScalePitches.sort((a, b) => a.cents - b.cents);
    } else {
        activeScalePitches.sort((a, b) => a.originalCents - b.originalCents);
    }

    // 4. Extract the true baseline fundamental as the implicit zero reference path
    const rootTonic = activeScalePitches.shift();
    const baselineCents = isTraditionalScale ? rootTonic.cents : rootTonic.originalCents;

    // 5. Calculate relative interval steps for all subsequent active notes
    const linesData = [];
    activeScalePitches.forEach((item) => {
        let currentCents = isTraditionalScale ? item.cents : item.originalCents;
        let relativeCents = currentCents - baselineCents;
        if (relativeCents < -0.01) relativeCents += 1200.0;
        
        if (relativeCents > 0.01) {
            let valueString = "";
            
            if (isCentsScale) {
                valueString = relativeCents.toFixed(5);
            } else if (isTraditionalScale) {
                valueString = item.ratio;
            } else {
                // Hybrid layout handling: extract original typed fraction strings dynamically
                const parts = item.key.split("__");
                let matchedOriginalToken = "";
                if (parts.length > 1) {
                    const uniqueSuffix = parts[1];
                    let targetIdx = -1;
                    if (uniqueSuffix.includes("_p")) targetIdx = parseInt(uniqueSuffix.split("_p")[0]);
                    else if (uniqueSuffix.includes("_d")) targetIdx = parseInt(uniqueSuffix.split("_d")[0]);
                    else targetIdx = parseInt(uniqueSuffix);
                    
                    if (!isNaN(targetIdx) && items[targetIdx]) {
                        let tok = items[targetIdx];
                        if (tok.includes("-")) tok = uniqueSuffix.includes("_d") ? tok.split("-")[1] : tok.split("-")[0];
                        if (tok.includes("(")) tok = tok.split("(")[0];
                        matchedOriginalToken = tok.trim();
                    }
                }
                valueString = matchedOriginalToken.includes("/") ? matchedOriginalToken : item.ratio;
            }

            linesData.push({
                name: item.name,
                valueString: valueString
            });
        }
    });

    // 6. Build the dynamic Scala file structure matching your exact scale layout
    let sclContent = `! ${computedScaleName}.scl\n`;
    sclContent += `Custom Scale Exporter - Dynamic Hybrid Format Engine\n`;
    sclContent += `${linesData.length + 1}\n`;
    sclContent += `!\n`;

    linesData.forEach(item => {
        sclContent += `${item.valueString}\n`;
    });
    sclContent += `2/1\n`; 
    sclContent += `!\n`;

    // 7. NOTE_NAMES mapping configuration line
    let namesRow = `! @ABL NOTE_NAMES "${rootTonic.name}"`;
    linesData.forEach(item => {
        namesRow += ` "${item.name}"`;
    });
    sclContent += `${namesRow}\n`;
    sclContent += `! @ABL REFERENCE_PITCH 0 0 ${masterBaseHz.toFixed(2)}\n`;

    // 8. Stream the file download directly to your directory
    const blob = new Blob([sclContent], { type: 'text/plain;charset=utf-8' }); 
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob); 
    link.download = `${computedScaleName}.scl`; 
    document.body.appendChild(link); 
    link.click(); 
    document.body.removeChild(link); 
    URL.revokeObjectURL(link.href);
}

}
